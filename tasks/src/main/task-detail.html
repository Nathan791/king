<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Détails de la tâche</title>
</head>
<body>
<h1>Détails de la tâche</h1>
<p><strong>ID :</strong> <span th:text="${task.id}"></span></p>
<p><strong>Contenu :</strong> <span th:text="${task.content}"></span></p>
<p><strong>Catégorie :</strong> <span th:text="${task.category.name}"></span></p>
<p><strong>Date de création :</strong> <span th:text="${task.creationDate}"></span></p>
<p><strong>Date d'échéance :</strong> <span th:text="${task.dueDate}"></span></p>
<p><strong>Statut :</strong> <span th:text="${task.status}"></span></p>
<p>
</p>
</body>
</html>
